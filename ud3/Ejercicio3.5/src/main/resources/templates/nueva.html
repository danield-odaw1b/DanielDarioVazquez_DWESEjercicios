<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nueva inscripción</title>
    <link rel="stylesheet" href="/estilos.css">
</head>
<body>
<header>
  <h1>NUEVA INSCRIPCIÓN</h1>
</header>
<main>
  <form th:action="@{/inscripciones}" method="post">
    <div class="form-fields">
        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" />
        <label for="turno">Turno</label>
        <select name="turno" id="turno">
            <option value="true">mañana</option>
            <option value="false">tarde</option>
        </select>
        <label for="comentarios">Comentarios</label>
        <textarea name="comentarios" id="comentarios"></textarea>
        <fieldset class="normas-options">
            <legend>Normas</legend>
            <label>
                <input type="radio" name="normas" value="true" checked />
                Leídas y aceptadas
            </label>
            <label>
                <input type="radio" name="normas" value="false" />
                No leídas o aceptadas
            </label>
        </fieldset>
    </div>
      <button type="submit">Enviar inscripción</button>
  </form>
</main>
</body>
</html>
