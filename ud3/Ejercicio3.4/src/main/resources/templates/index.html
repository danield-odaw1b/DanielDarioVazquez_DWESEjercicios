<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Lista de Módulos</title>
</head>
<body>
<h1>LISTADO DE MÓDULOS</h1>
<div>
    <a th:href="@{/index}">Todos</a>
    <a th:href="@{/index(curso = 1)}">Modulos de primero</a>
    <a th:href="@{/index(curso = 2)}">Modulos de segundo</a>
</div>

<form method="get" th:action="@{/index}">
    <label>
        <select name="curso">
            <option value="">Todos</option>
            <option value="1">1º</option>
            <option value="2">2º</option>
        </select>
    </label>
    <button type="submit">Filtrar</button>
</form>
<ul  th:each="modulo: ${modulos}">
    <li th:text="${modulo.nombre}"></li>
    <li><a th:href="@{/index/{id}(id=${modulo.id})}">Detalles</a></li>
</ul>
</body>
</html>
